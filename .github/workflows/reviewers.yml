name: Translation reviewers

# Mentions a language's reviewers (the "reviewers" list in
# src/i18n/glossary/<locale>.json) on pull requests that change that language.
# Reviewers don't need write access: their approval is advisory and a
# maintainer merges.
#
# pull_request_target so the comment works on forks. It never checks out or
# runs pull request code: it reads the changed file names from the API and the
# glossaries from the base branch.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/i18n/locales/**"
      - "src/i18n/glossary/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  mention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const locales = new Set();
            for (const { filename } of files) {
              const match =
                filename.match(/^src\/i18n\/locales\/([^/]+)\//) ??
                filename.match(/^src\/i18n\/glossary\/([^/]+)\.json$/);
              if (match && match[1] !== "en") locales.add(match[1]);
            }
            const lines = [];
            for (const locale of [...locales].sort()) {
              let glossary;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner, repo, ref: pr.base.sha,
                  path: `src/i18n/glossary/${locale}.json`,
                });
                glossary = JSON.parse(Buffer.from(data.content, "base64").toString("utf8"));
              } catch {
                lines.push(`- **${locale}**: no glossary yet, so no reviewers. A maintainer will pick this up.`);
                continue;
              }
              const reviewers = (glossary.reviewers ?? []).filter(
                (login) => login.toLowerCase() !== pr.user.login.toLowerCase()
              );
              lines.push(
                reviewers.length
                  ? `- **${glossary.language}** (\`${locale}\`): ${reviewers.map((l) => `@${l}`).join(", ")}`
                  : `- **${glossary.language}** (\`${locale}\`): no reviewer yet. Want to be one? See TRANSLATING.md.`
              );
            }
            if (!lines.length) return;
            const marker = "<!-- i18n-reviewers -->";
            const body = `${marker}\nThis pull request changes translations. Language reviewers, please check the wording:\n\n${lines.join("\n")}\n\nAn approving review or a 👍 comment is enough; a maintainer merges.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            // Edit in place: mentions in an edited comment don't notify again.
            if (existing) {
              if (existing.body !== body)
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
